server:
  port: 8084

spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reconciliation}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}   # test-mode key from .env, never committed

fineract:
  base-url: ${FINERACT_URL:http://localhost:8443/fineract-provider/api/v1}
  username: ${FINERACT_USER:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant: default
  connect-timeout-ms: 2000
  read-timeout-ms: 15000

reconciliation:
  lookback-hours: 48            # how far back each run compares
  grace-seconds: 300            # a difference must persist this long before it raises an alert (work in flight)
  savings-account-ids: ${RECON_SAVINGS_IDS:2}
  schedule:
    enabled: true
    interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # needed for p99 in Prometheus/Grafana
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
