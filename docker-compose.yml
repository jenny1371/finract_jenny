# Fineract (ledger / "bank") + Postgres. Local dev only.
services:
  fineract-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FINERACT_DB_PASSWORD:?set in .env}
    volumes:
      - fineract-db:/var/lib/postgresql/data
      - ./fineract/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fineract:
    image: apache/fineract:latest
    depends_on:
      fineract-db:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://fineract-db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: postgres
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD:?set in .env}
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: fineract-db
      FINERACT_DEFAULT_TENANTDB_PORT: 5432
      FINERACT_DEFAULT_TENANTDB_UID: postgres
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD:?set in .env}
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: 8443
      FINERACT_SECURITY_BASICAUTH_ENABLED: "true"
      FINERACT_SECURITY_OAUTH_ENABLED: "false"

volumes:
  fineract-db:

