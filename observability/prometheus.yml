global:
  scrape_interval: 5s
scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:   # services run on the host during dev (mvn spring-boot:run)
      - targets:
          - host.docker.internal:8081   # order
          - host.docker.internal:8082   # payment
          - host.docker.internal:8083   # ledger
          - host.docker.internal:8084   # reconciliation
