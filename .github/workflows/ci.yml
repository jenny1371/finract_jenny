name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify
  data-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: data-platform/requirements.txt }
      - run: pip install -r data-platform/requirements.txt
      # lake_writer unit tests + the real dbt project over a synthetic lake (duplicates, updates, deletes, reversals)
      - run: python -m pytest data-platform/tests -q
      - run: cd data-platform/dbt && dbt parse --profiles-dir .
